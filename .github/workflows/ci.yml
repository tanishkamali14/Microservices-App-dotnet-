name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MicroservicesShop.sln

      - name: Build
        run: dotnet build MicroservicesShop.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test MicroservicesShop.sln
          --configuration Release
          --no-build
          --logger trx
          --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

  container-images:
    name: Build container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build every service image
        run: docker compose build
